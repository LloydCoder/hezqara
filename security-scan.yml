# Carenova AI — Security Scan Pipeline
# Runs on every PR and push to main
# TruffleHog for secrets, Ruff for Python security linting

name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Run every day at 2 AM UTC
    - cron: "0 2 * * *"

jobs:

  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history for accurate diff scanning

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --output=json || true

      - name: Audit Node.js dependencies
        working-directory: frontend
        run: |
          npm audit --audit-level=high || true

  hipaa-phi-check:
    name: HIPAA PHI Leak Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for hardcoded PHI patterns
        run: |
          # Scan for common PHI patterns that should never be in code
          FOUND=0

          # SSN pattern
          if grep -rn "\b[0-9]{3}-[0-9]{2}-[0-9]{4}\b" --include="*.py" --include="*.ts" .; then
            echo "❌ Potential SSN found in code"
            FOUND=1
          fi

          # Check .env files aren't committed
          if git ls-files | grep -E "^\.env$|/\.env$"; then
            echo "❌ .env file committed — remove immediately"
            FOUND=1
          fi

          if [ "$FOUND" = "1" ]; then
            exit 1
          fi

          echo "✅ No PHI patterns detected"
