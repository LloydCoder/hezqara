# Carenova AI — Production Docker Compose Overrides
# Apply with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: "3.9"

services:

  backend:
    build:
      target: production
    environment:
      - APP_ENV=production
      - LOG_LEVEL=warning
    volumes: []          # No hot-reload in production
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  celery-worker:
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  celery-beat:
    restart: always

  redis:
    expose:
      - "6379"
    ports: []            # Not exposed externally in production

  falkordb:
    expose:
      - "6379"
    ports: []

  graphiti:
    expose:
      - "8005"
    ports: []

  frontend:
    environment:
      - NEXT_PUBLIC_API_URL=https://carenova.tinlance.com/api
    restart: always
