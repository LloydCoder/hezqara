# Carenova AI — nginx reverse proxy
# EC2 Stockholm (13.50.16.19)
# Backend: port 8004 | Frontend: port 3004
# SSL termination via Let's Encrypt (certbot)

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=10r/m;

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name carenova.tinlance.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS main server ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name carenova.tinlance.com;

    # SSL — managed by certbot
    ssl_certificate     /etc/letsencrypt/live/carenova.tinlance.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carenova.tinlance.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Backend API ───────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass         http://127.0.0.1:8004/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — voice calls can run long
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── Retell AI Webhook — separate rate limit ───────────────────────────────
    location /api/voice/webhook {
        limit_req zone=webhook burst=5 nodelay;

        proxy_pass         http://127.0.0.1:8004/voice/webhook;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # No timeout on webhooks — Retell can take time
        proxy_read_timeout 300s;
    }

    # ── Health check — no rate limit, no auth ─────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:8004/health;
        access_log off;
    }

    # ── Frontend — Next.js ────────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Static assets — cache aggressively ───────────────────────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3004;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── API docs — dev only, block in production ──────────────────────────────
    location /docs {
        deny all;
        return 403;
    }

    # Logging
    access_log /var/log/nginx/carenova.access.log;
    error_log  /var/log/nginx/carenova.error.log warn;
}
