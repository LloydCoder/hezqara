name: Feature request
description: Propose a product or engineering improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operational problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and boundaries.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security, tenancy and healthcare impact
      description: Explain tenant, authorization, PHI, AI governance, interoperability or compliance implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
