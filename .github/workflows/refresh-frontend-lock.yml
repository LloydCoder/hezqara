name: Temporary frontend lockfile refresh

on:
  push:
    branches:
      - chore/consolidate-security-dependency-refresh
    paths:
      - frontend/package.json
      - .github/workflows/refresh-frontend-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/chore/consolidate-security-dependency-refresh'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Regenerate npm lockfile without executing package scripts
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore(deps): regenerate frontend lockfile"
          git push origin HEAD:chore/consolidate-security-dependency-refresh
