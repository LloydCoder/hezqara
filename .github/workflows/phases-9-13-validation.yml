name: HEZQARA Phases 9-13 Validation
on:
  push:
    branches: ["implementation/e4-interoperability", "implementation/e3-durable-execution", "implementation/e2-tenant-isolation", "implementation/e1-final", "implementation/e5-enterprise-security", "implementation/e6-commercial-platform", "implementation/e7-first-clinic-vertical-slice", "main"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hezqara-phases-9-13-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.12"}
      - working-directory: backend
        run: pip install -r requirements.txt ruff
      - working-directory: backend
        run: python -m compileall -q app
      - working-directory: backend
        run: pip check
      - working-directory: backend
        run: ruff check app tests ../tests/security
      - working-directory: backend
        env: {APP_ENV: test, PYTHONPATH: .}
        run: pytest -q tests ../tests/security
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: hezqara_ci}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d hezqara_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: "3.12"}
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare roles
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgcrypto; DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF; IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF; IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN; END IF; END \$\$;"
      - name: Prepare Supabase auth compatibility schema
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/ci_auth_compat.sql
      - name: Apply every production migration in version order
        env: {PGPASSWORD: postgres}
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort -V)
          test "${#migrations[@]}" -gt 0
          for migration in "${migrations[@]}"; do
            echo "Applying $migration"
            psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f "supabase/migrations/$migration"
          done
      - name: Prove tenant isolation for new surfaces
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/phases9_13_rls.sql
      - name: Prove workflow referential tenant integrity
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/workflow_tenant_integrity.sql
      - name: Prove E3 durable execution state machine
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/e3_durable_execution.sql
      - name: Prove E4 interoperability metadata and SMART boundary
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/e4_interoperability.sql
      - name: Prove E6 commercial platform tenant and ledger controls
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/e6_commercial_platform.sql
      - name: Prove E5 enterprise security and privacy evidence
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/e5_enterprise_security.sql
      - name: Prove E2 canonical tenant isolation and relationship integrity
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/e2_tenant_isolation.sql
      - name: Prove legacy RLS surfaces
        env: {PGPASSWORD: postgres}
        run: |
          set -e
          for test in phase3_rls.sql phase4_workflow_rls.sql phase5_rls.sql phase6_rls.sql phase7_rls.sql phase9_rls.sql; do
            psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f "supabase/tests/$test"
          done
      - name: Seed synthetic clinic for authenticated vertical slice
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/ci_vertical_slice_seed.sql
      - name: Install backend dependencies for database vertical slices
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run E7 first-clinic production vertical slice
        env: {APP_ENV: test, DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/hezqara_ci, PYTHONPATH: backend, REDIS_URL: redis://127.0.0.1:6379/0}
        run: python backend/tests/ci_e7_vertical_slice.py
      - name: Run existing database-backed vertical slices
        env: {APP_ENV: test, DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/hezqara_ci, PYTHONPATH: backend, REDIS_URL: ""}
        run: python backend/tests/ci_workflow_vertical_slice.py && python backend/tests/ci_phase5_vertical_slice.py
      - name: Backend import with production-like database
        env: {APP_ENV: test, DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/hezqara_ci, PYTHONPATH: backend, REDIS_URL: ""}
        run: python -c "from app.main import app; print(app.title, app.version)"
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: "24"}
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run type-check
      - working-directory: frontend
        env: {NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5hY2NvdW50cy5kZXYk}
        run: npm run build
