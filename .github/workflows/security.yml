name: HEZQARA Security
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'refactor/**']
  schedule:
    - cron: '0 2 * * *'
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip pip-audit
      - working-directory: backend
        run: pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: frontend
        run: npm install --no-audit --no-fund && npm audit --audit-level=high
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed secrets, demo tenant identifiers and placeholders
        run: |
          ! git ls-files | grep -E '(^|/)(\.env|\.env\..+)$' | grep -vE '(\.example|\.template)$'
          ! grep -RniE 'NEXT_PUBLIC_DEMO_CLINIC_ID|demo_clinic_ng|demo_clinic' frontend backend --exclude-dir=node_modules
          ! grep -RniE 'NotImplementedError|TODO[[:space:]]*$|FIXME[[:space:]]*$' backend/app frontend/src
          ! grep -RniE 'sk_(live|test)_[A-Za-z0-9]+|whsec_[A-Za-z0-9]+|Bearer[[:space:]]+[A-Za-z0-9._-]{20,}' backend frontend --exclude-dir=node_modules
