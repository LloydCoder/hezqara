name: HEZQARA Security
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'refactor/**', 'implementation/e1-final', 'implementation/e5-enterprise-security']
  schedule:
    - cron: '0 2 * * *'
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip pip-audit
      - working-directory: backend
        run: pip-audit -r requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24'}
      - working-directory: frontend
        run: npm ci --no-audit --no-fund && npm audit --audit-level=high
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reject committed secrets, demo tenant identifiers and placeholders
        run: |
          ! git ls-files | grep -E '(^|/)(\.env|\.env\..+)$' | grep -vE '(\.example|\.template)$'
          ! grep -RniE 'NEXT_PUBLIC_DEMO_CLINIC_ID|demo_clinic_ng|demo_clinic' frontend backend --exclude-dir=node_modules
          ! grep -RniE 'NotImplementedError|TODO[[:space:]]*$|FIXME[[:space:]]*$' backend/app frontend/src
          ! grep -RniE 'sk_(live|test)_[A-Za-z0-9]+|whsec_[A-Za-z0-9]+|Bearer[[:space:]]+[A-Za-z0-9._-]{20,}' backend frontend --exclude-dir=node_modules
  api-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - working-directory: backend
        run: pip install -r requirements.txt ruff
      - working-directory: backend
        env: {APP_ENV: test, PYTHONPATH: .}
        run: pytest -q tests/test_phase6_security.py tests/test_security_architecture.py tests/test_webhook_security.py tests/test_phase7_security.py tests/test_phase8_analytics.py tests/test_phase8_analytics_security.py tests/test_phase9_ai_governance.py tests/test_ai_governance_enforcement.py
  integration-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - working-directory: backend
        run: pip install -r requirements.txt
      - working-directory: backend
        env: {APP_ENV: test, PYTHONPATH: .}
        run: pytest -q tests/test_phase7_integrations.py tests/test_phase7_security.py
  fhir-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - working-directory: backend
        run: pip install -r requirements.txt
      - working-directory: backend
        env: {APP_ENV: test, PYTHONPATH: .}
        run: pytest -q tests/test_phase7_integrations.py -k fhir
  ai-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - working-directory: backend
        run: pip install -r requirements.txt
      - working-directory: backend
        env: {APP_ENV: test, PYTHONPATH: .}
        run: pytest -q tests/test_phase6_security.py tests/test_ai_workforce.py tests/test_tool_registry.py tests/test_phase7_security.py tests/test_phase9_ai_governance.py tests/test_ai_governance_enforcement.py


  secrets-broad:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          artifact-name: hezqara-e5-sbom.spdx.json
          format: spdx-json
          output-file: hezqara-e5-sbom.spdx.json
