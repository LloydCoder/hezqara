name: Finalize canonical layout

on:
  push:
    branches: ["refactor/canonical-architecture"]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor == 'LloydCoder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remove legacy root duplicates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/architecture docs/growth ops .github

          for f in agent.ts analytics.ts api.ts patient.ts globals.css layout.tsx middleware.ts next.config.ts package.json postcss.config.mjs tailwind.config.ts tsconfig.json; do
            [ -f "$f" ] && git rm -f "$f" || true
          done

          [ -f acquisition.html ] && git mv acquisition.html docs/growth/acquisition.html || true
          [ -f backup_db.sh ] && git mv backup_db.sh ops/backup_db.sh || true
          [ -f CONTEXT.md ] && git mv CONTEXT.md docs/architecture/CONTEXT.md || true
          [ -f CARENOVA_COMPLETE_DOCUMENTATION.md ] && git mv CARENOVA_COMPLETE_DOCUMENTATION.md docs/architecture/legacy-carenova-documentation.md || true
          [ -f PULL_REQUEST_TEMPLATE.md ] && git mv PULL_REQUEST_TEMPLATE.md .github/PULL_REQUEST_TEMPLATE.md || true
          [ -f carenova-dashboard-complete.jsx ] && git rm -f carenova-dashboard-complete.jsx || true

          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -not -path './.git/*' -delete
          find . -type d \( -name '__pycache__' -o -name '.pytest_cache' -o -name '.mypy_cache' -o -name '.ruff_cache' \) -not -path './.git/*' -prune -exec rm -rf {} +
          rm -rf mnt

          # This is a one-shot migration workflow; do not leave it in the product repo.
          git rm -f .github/workflows/cleanup-layout.yml || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: remove legacy root artifacts and finalize layout'
          git push
