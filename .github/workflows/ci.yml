name: HEZQARA CI
on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]
permissions: {contents: read}
concurrency:
  group: hezqara-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Canonical architecture gates
        run: |
          test -f backend/app/main.py; test -f backend/app/security/clerk.py; test -f backend/app/domains/patients/service.py; test -f backend/app/domains/workflows/service.py; test -f backend/app/domains/patient_engagement/service.py; test -f backend/app/domains/claims/engine.py; test -f backend/app/integrations/fhir/adapter.py; test -f backend/app/ai/administrative.py; test -f frontend/src/proxy.ts; test -f supabase/migrations/020_phase6_healthcare_domain_engine.sql; test -f supabase/tests/phase6_rls.sql
          test -z "$(find backend/app -maxdepth 1 -type f -name '*.py' ! -name '__init__.py' ! -name 'main.py')"
          ! find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -not -path './.git/*' | grep -q .
          ! find . -type d \( -name '__pycache__' -o -name '.pytest_cache' -o -name '.next' \) -not -path './.git/*' | grep -q .
          ! grep -RniE 'NEXT_PUBLIC_DEMO_CLINIC_ID|demo_clinic_ng|demo_clinic' frontend backend --exclude-dir=node_modules
          ! grep -RniE 'NotImplementedError|TODO[[:space:]]*$|FIXME[[:space:]]*$' backend/app frontend/src
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - working-directory: backend
        run: pip install -r requirements.txt ruff
      - working-directory: backend
        run: python -m compileall -q app
      - working-directory: backend
        run: pip check
      - working-directory: backend
        run: ruff check app tests ../tests/security
      - working-directory: backend
        env: {APP_ENV: test, PYTHONPATH: .}
        run: pytest -q tests ../tests/security
  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: hezqara_ci}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d hezqara_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare roles and extension
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgcrypto; DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF; IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF; IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN; END IF; END \$\$;"
      - name: Apply migrations
        env: {PGPASSWORD: postgres}
        run: |
          for migration in 001_create_clinics.sql 002_create_patients.sql 003_create_appointments.sql 011_create_audit_log.sql 015_harden_tenant_rls.sql 016_rls_complete_surface.sql 017_phase3_operational_core.sql 018_phase4_workflow_runtime.sql 019_phase5_operations.sql 020_phase6_healthcare_domain_engine.sql; do psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f "supabase/migrations/$migration"; done
      - name: Prove Phase 3 isolation
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/phase3_rls.sql
      - name: Prove Phase 4 isolation
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/phase4_workflow_rls.sql
      - name: Prove Phase 5 isolation
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/phase5_rls.sql
      - name: Prove Phase 6 isolation
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/phase6_rls.sql
      - name: Install backend
        run: pip install -r backend/requirements.txt
      - name: Verify backend imports
        env: {APP_ENV: test, DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/hezqara_ci, PYTHONPATH: backend, REDIS_URL: ''}
        run: python -c "from app.main import app; print(app.title)"
      - name: Seed synthetic API tenant
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -c "INSERT INTO clinics(id,name,clerk_org_id) VALUES ('test-clinic','CI Synthetic Clinic','test_org') ON CONFLICT (id) DO NOTHING;"
      - name: Run existing vertical slices
        env: {APP_ENV: test, DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/hezqara_ci, PYTHONPATH: backend, REDIS_URL: '', CLERK_SECRET_KEY: '', CLERK_PUBLISHABLE_KEY: '', CLERK_AUTHORIZED_PARTIES: ''}
        run: python backend/tests/ci_workflow_vertical_slice.py && python backend/tests/ci_phase5_vertical_slice.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: frontend
        run: npm install --no-audit --no-fund
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run type-check
      - name: Production build
        working-directory: frontend
        env: {NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jb20k}
        run: npm run build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: frontend
        run: npm install --no-audit --no-fund
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run e2e
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [structure, backend, database-security, frontend, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Compose syntax
        run: docker compose config
      - name: Backend image
        run: docker build -f backend/Dockerfile --target production backend
      - name: Frontend image
        run: docker build --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_ZXhhbXBsZS5jb20k -f frontend/Dockerfile frontend
