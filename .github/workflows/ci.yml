name: HEZQARA CI
on:
  push:
    branches: [main, 'refactor/**', 'implementation/e1-final', 'implementation/e5-enterprise-security', 'implementation/e6-commercial-platform', 'implementation/e7-first-clinic-vertical-slice']
  pull_request:
    branches: [main]
permissions: {contents: read}
concurrency:
  group: hezqara-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Canonical repository gates
        run: |
          set -euo pipefail
          required=(backend/app/main.py backend/app/security/clerk.py backend/app/ai/governance/contracts.py backend/app/ai/governance/service.py backend/app/workforce/registry.py backend/app/api/v1/executions.py frontend/package.json frontend/src/proxy.ts supabase/migrations/024_phase9_ai_governance.sql supabase/migrations/029_phase9_tenant_integrity_and_controls.sql supabase/migrations/030_workflow_tenant_integrity.sql supabase/migrations/031_ai_approval_lifecycle.sql supabase/migrations/032_phase10_13_tenant_policy_hardening.sql supabase/migrations/033_phase9_tenant_policy_hardening.sql supabase/migrations/035_phase14_e2_tenant_isolation.sql supabase/migrations/036_phase15_e3_durable_execution.sql supabase/migrations/037_phase16_e4_interoperability_metadata.sql supabase/migrations/038_phase17_e5_enterprise_security.sql supabase/migrations/039_phase18_e6_commercial_platform.sql supabase/migrations/040_phase19_e7_vertical_slice.sql supabase/migrations/044_e10_patient_access_workforce.sql supabase/migrations/045_e10_tenant_integrity_hardening.sql supabase/migrations/046_e10_booking_and_action_idempotency.sql supabase/migrations/047_e10_waitlist_idempotency.sql supabase/migrations/048_e10_authenticated_grants.sql supabase/migrations/049_e11_insurance_authorization_workforce.sql supabase/migrations/050_e12_revenue_cycle_workforce.sql supabase/migrations/051_e13_patient_financial_workforce.sql supabase/migrations/052_e14_document_referral_intelligence.sql supabase/migrations/053_e15_ambient_clinical_documentation.sql supabase/migrations/054_e16_documentation_intelligence.sql supabase/migrations/055_e17_patient_engagement_care_gaps.sql supabase/migrations/056_e18_unified_workforce.sql supabase/migrations/057_e20_ai_governance_mcp.sql supabase/migrations/058_e21_interoperability_productionization.sql supabase/migrations/059_e22_security_compliance_controls.sql supabase/migrations/060_e23_reliability_dr.sql supabase/migrations/061_e24_commercial_ga.sql)
          for path in "${required[@]}"; do test -f "$path" || { echo "missing required path: $path"; exit 1; }; done
          if grep -RniE 'NEXT_PUBLIC_DEMO_CLINIC_ID|demo_clinic_ng' frontend backend --exclude-dir=node_modules; then echo 'forbidden demo tenant identifier found'; exit 1; fi
          if grep -RniE 'NotImplementedError|TODO[[:space:]]*$|FIXME[[:space:]]*$' backend/app frontend/src; then echo 'unfinished placeholder found'; exit 1; fi
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - working-directory: backend
        run: pip install -r requirements.txt ruff
      - working-directory: backend
        run: python -m compileall -q app
      - working-directory: backend
        run: pip check
      - working-directory: backend
        run: ruff check app tests ../tests/security
      - working-directory: backend
        env: {APP_ENV: test, PYTHONPATH: .}
        run: pytest -q tests ../tests/security
  phase7-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - working-directory: backend
        run: pip install -r requirements.txt
      - working-directory: backend
        env: {APP_ENV: test, PYTHONPATH: .}
        run: pytest -q tests/test_phase7_integrations.py tests/test_phase7_security.py
  phase8-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - working-directory: backend
        run: pip install -r requirements.txt
      - working-directory: backend
        env: {APP_ENV: test, PYTHONPATH: .}
        run: pytest -q tests/test_phase8_analytics.py tests/test_phase8_analytics_security.py
  phase9-ai-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - working-directory: backend
        run: pip install -r requirements.txt
      - working-directory: backend
        env: {APP_ENV: test, PYTHONPATH: .}
        run: pytest -q tests/test_phase9_ai_governance.py tests/test_ai_guardrails.py
  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: hezqara_ci}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d hezqara_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare roles and extension
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgcrypto; DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF; IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF; IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN; END IF; END \$\$;"
      - name: Prepare Supabase auth compatibility schema
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/ci_auth_compat.sql
      - name: Apply every migration in version order
        env: {PGPASSWORD: postgres}
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort -V)
          for migration in "${migrations[@]}"; do echo "Applying $migration"; psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f "supabase/migrations/$migration"; done
      - name: Prove Phase 3 isolation
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/phase3_rls.sql
      - name: Prove Phase 4 isolation
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/phase4_workflow_rls.sql
      - name: Prove Phase 5 isolation
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/phase5_rls.sql
      - name: Prove Phase 6 isolation
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/phase6_rls.sql
      - name: Prove Phase 7 isolation
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/phase7_rls.sql
      - name: Prove Phase 9 isolation
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/phase9_rls.sql
      - name: Prove E5 enterprise security and privacy evidence
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/e5_enterprise_security.sql
      - name: Prove E6 commercial platform tenant and ledger controls
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/e6_commercial_platform.sql
      - name: Prove E7 activation tenant isolation
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/e7_vertical_slice.sql
      - name: Prove E10 patient access isolation
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/e10_patient_access.sql
      - name: Prove E17 patient engagement isolation
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/e17_patient_engagement.sql
      - name: Prove E18 unified workforce isolation
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/e18_unified_workforce.sql
      - name: Prove E20 AI governance tool isolation
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/e20_ai_governance_mcp.sql
      - name: Prove E21 interoperability isolation
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/e21_interoperability.sql
      - name: Prove E22 security compliance isolation
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/e22_security_compliance.sql
      - name: Prove E23 reliability isolation
        env: {PGPASSWORD: postgres}
        run: psql -h 127.0.0.1 -U postgres -d hezqara_ci -v ON_ERROR_STOP=1 -f supabase/tests/e23_reliability.sql
      - name: Install backend dependencies for production-like import
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Verify backend imports
        env: {APP_ENV: test, DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/hezqara_ci, PYTHONPATH: backend, REDIS_URL: ''}
        run: python -c "from app.main import app; print(app.title, app.version)"
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24'}
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run type-check
      - name: Production build
        working-directory: frontend
        env: {NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5hY2NvdW50cy5kZXYk}
        run: npm run build
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24'}
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npx playwright install chromium
      - working-directory: frontend
        run: npm run e2e
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [structure, backend, phase7-integration, phase8-analytics, phase9-ai-governance, database-security, frontend, e2e]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Compose syntax
        run: docker compose config
      - name: Backend image
        run: docker build -f backend/Dockerfile --target production backend
      - name: Frontend image
        run: docker build --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_ZXhhbXBsZS5hY2NvdW50cy5kZXYk -f frontend/Dockerfile frontend
