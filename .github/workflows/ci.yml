name: HEZQARA CI
on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f backend/app/main.py
          test -f backend/app/security/clerk.py
          test -f backend/app/domains/patients/service.py
          test -f backend/app/workforce/base/contracts.py
          test -f backend/app/ai/orchestration/executor.py
          test -f frontend/src/proxy.ts
          test -f supabase/migrations/015_harden_tenant_rls.sql
          test -z "$(find backend/app -maxdepth 1 -type f -name '*.py' ! -name '__init__.py' ! -name 'main.py')"
      - run: |
          ! find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -not -path './.git/*' | grep -q .
          ! find . -type d \( -name '__pycache__' -o -name '.pytest_cache' -o -name '.next' \) -not -path './.git/*' | grep -q .
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - working-directory: backend
        run: pip install -r requirements.txt ruff
      - working-directory: backend
        env: {APP_ENV: test}
        run: python -m compileall -q app && pip check && ruff check app ../tests/backend && pytest -q ../tests/backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: frontend
        run: npm install --no-audit --no-fund
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run type-check
      - working-directory: frontend
        run: npm run build
